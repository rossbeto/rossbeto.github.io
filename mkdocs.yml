# A Coder's CV: personal portfolio (plan: prj_porfolio_mk/plan/masterplan.md)
site_name: A Coder's CV
site_url: https://rossbeto.github.io/
site_description: Senior software engineer. Backend and cloud systems, multi-tenant platforms, deploy automation, and the labs that prove it.
repo_url: https://github.com/rossbeto/rossbeto.github.io
repo_name: rossbeto.github.io
edit_uri: ""                         # no "edit this page" button
copyright: "Content and code under the MIT licence"
exclude_docs: |                      # notes for the author, not pages
  README.md
  *.example

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/img/avatar.svg
  favicon: assets/img/avatar.svg
  font: false                        # self-hosted in docs/assets/fonts (stylesheets/fonts.css)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  social:
    - { icon: fontawesome/brands/linkedin, link: "https://www.linkedin.com/in/lam-nguyen-723b279/", name: LinkedIn }
    - { icon: fontawesome/brands/github, link: "https://github.com/rossbeto", name: GitHub }
  generator: false                   # no "Made with Material for MkDocs" line

plugins:
  - search
  - blog:                            # Material's built-in blog (D-07)
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_readtime: true
      post_excerpt: required         # every post needs `<!-- more -->` after its intro
      archive: true
      categories: true
      pagination_per_page: 10
      draft_on_serve: true           # drafts show in `make serve`, never in the build
  - tags                             # tag chips on posts; the index is docs/blog/tags.md

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:               # pulls generated/*.md into pages (`portfolio generate`)
      base_path: [generated]
      check_paths: true              # a missing generated file fails the build
  - toc:
      permalink: true

nav:
  - Home: index.md
  - CV: cv/index.md
  - Projects:                       # one line per project page (strict build fails if missing)
      - projects/index.md
      - tenantlab: projects/tenantlab.md
  - Blog:
      - blog/index.md
      - Tags: blog/tags.md

# `mkdocs build --strict` turns these warnings into errors.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
