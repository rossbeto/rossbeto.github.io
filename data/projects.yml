# Project pages synced from each project's own repository (Phase 006, decision D-14).
# `make projects-sync` turns the repo's `docs/portfolio-card.md` at `ref` into
# `docs/projects/<slug>.md` and copies `media` to `docs/assets/projects/<slug>/`.
# The card contract (sections, links): README.md, "Sync a project from its repo".
#
# Public repositories only (no token). `ref` is a full commit SHA: the page changes only when the
# ref changes, through a reviewed pull request (.github/workflows/sync-projects.yml bumps it).
# A synced page overwrites a hand-written page with the same slug.
#
# tenantlab is not listed yet: its repository is still private, and its hand-written case study
# (docs/projects/tenantlab.md) has more than the card. When the repo is public, either move the
# extra sections into the card and add the entry below, or keep the page hand-written.

