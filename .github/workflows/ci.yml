name: ci

# Pull requests: the same checks as `make check`. Deploys live in pages.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PORTFOLIO_PDF: required      # no CV PDF is a failed build here (a laptop may skip it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # the forbidden-terms check reads commit messages
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: WeasyPrint's system libraries (the CV PDF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - run: make check
      - name: Synced project pages match their pinned cards
        run: make projects-check
      - name: The CV PDF, for the reviewer to read before merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-pdf
          path: site/cv/*.pdf
          if-no-files-found: error
          retention-days: 14
